<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to X</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }

        body {
            /* Exact X Developer spotlight background aesthetic */
            background-color: #0b0b0b;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            overflow: hidden;
            position: relative;
        }

        /* Diagonal light beam effect matching the X developer portal screenshot */
        body::before {
            content: "";
            position: absolute;
            top: -20%;
            right: -10%;
            width: 70vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 40%, transparent 70%);
            transform: rotate(-25deg);
            pointer-events: none;
            filter: blur(60px);
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background-color: rgba(16, 18, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 44px 36px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #71767b;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .x-login-btn {
            background-color: #ffffff;
            color: #0f1419;
            border: none;
            border-radius: 24px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .x-login-btn:hover { background-color: #e7e9ea; }
        .x-login-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="login-card">
        <svg viewBox="0 0 24 24" fill="#ffffff" style="width: 38px; height: 38px; margin: 0 auto 18px auto; display: block;" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <h2 class="login-title">Sign in to X</h2>
        <p class="login-subtitle">Before proceeding to the Database, please authenticate with your Official X account.</p>
        <button class="x-login-btn" id="loginBtn" type="button">
          Sign in with
            <svg viewBox="0 0 24 24" fill="#0f1419" style="width: 18px; height: 18px;" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const X_CLIENT_ID = "VXlLVEtZMlVZNUNzbjhrSjMySVo6MTpjaQ"; 
    const REDIRECT_URI = "https://januzhvhynz-hash.github.io/Xtest/";

    const loginBtn = document.getElementById("loginBtn");

    loginBtn.onclick = function() {
        const stateSetting = "state_security_token";
        const xOauthUrl = `https://twitter.com/i/oauth2/authorize?client_id=${X_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=tweet.read%20users.read&state=${stateSetting}&code_challenge=challenge&code_challenge_method=plain`;
        window.location.href = xOauthUrl;
    };
</script>

</body>
</html>
