<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X (Twitter) Login & Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; }
        body { background: radial-gradient(circle at 50% 50%, #202b6e 0%, #0d133a 50%, #060922 100%); background-attachment: fixed; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 16px; }
        .container { width: 100%; max-width: 680px; text-align: center; position: relative; z-index: 1; }
        .hidden { display: none !important; }
        .main-title { margin-bottom: 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .brand-header-row { display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
        .brand-text { color: #ffffff; font-size: 38px; font-weight: 900; }
        .title-sub { display: block; color: #ffffff; font-size: 22px; font-weight: 800; text-transform: uppercase; }
        .dashboard-card { background-color: rgba(30, 31, 34, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 36px 32px; text-align: left; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); }
        .login-card { background-color: #16181c; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 40px 36px; text-align: center; max-width: 440px; margin: 0 auto; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); position: relative; z-index: 10; }
        .login-title { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
        .login-subtitle { font-size: 14px; color: #71767b; margin-bottom: 28px; line-height: 1.5; }
        .x-login-btn { background-color: #ffffff; color: #0f1419; border: none; border-radius: 24px; padding: 14px 20px; font-size: 15px; font-weight: 700; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; z-index: 20; }
        .user-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.1); }
        .user-info .username { font-size: 20px; font-weight: 700; }
        .user-info .id { color: #71767b; font-size: 13px; margin-top: 2px; }
        .section-title { text-align: center; font-size: 16px; font-weight: 800; margin-bottom: 24px; color: #b5bac1; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 36px; }
        .field-group { margin-bottom: 16px; }
        .warning-box { background-color: rgba(255, 235, 235, 0.3); border: 1px solid rgba(255, 150, 150, 0.4); border-radius: 10px; padding: 12px 14px; }
        .field-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
        .field-label.dark-red-text { color: #d83a3a; }
        .field-label.white-text { color: #ffffff; }
        .field-value { font-weight: 700; font-size: 14px; word-break: break-all; padding-left: 22px; }
        .field-value.dark-red-text { color: #d83a3a; }
        .field-value.white-text { color: #ffffff; }
        .top-action-btn { background: linear-gradient(135deg, #1da1f2, #0d8ecf); color: #ffffff; border-radius: 10px; height: 42px; width: 100%; margin-bottom: 14px; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer; }
        .top-action-btn.completed { background: linear-gradient(135deg, #42b883, #57d9a3); }
        #popupModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
        .popup-box { background-color: #16181c; border-radius: 14px; padding: 24px; width: 100%; max-width: 640px; }
        .popup-textarea { width: 100%; height: 280px; background-color: rgba(18, 19, 21, 0.8); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #ffffff; padding: 16px; resize: none; outline: none; }
        .locked-input { opacity: 0.5; pointer-events: none; cursor: not-allowed !important; }
        .progress-container { background-color: rgba(0,0,0,0.3); border-radius: 10px; height: 42px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .progress-bar { background: linear-gradient(90deg, #42b883, #57d9a3); height: 100%; width: 0%; position: absolute; left: 0; top: 0; transition: width 0.5s ease; }
        .progress-label-overlay { position: relative; z-index: 2; display: flex; gap: 8px; font-weight: 800; font-size: 13px; }
        .box-input-wrapper { background-color: rgba(18, 19, 21, 0.6); border-radius: 10px; height: 42px; margin-top: 14px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        .box-input-wrapper input, .box-input-wrapper select { width: 100%; height: 100%; background: transparent; border: none; color: #ffffff; text-align: center; font-weight: 600; font-size: 13px; outline: none; padding: 0 14px; }
        .box-input-wrapper option { background-color: #16181c; color: #ffffff; }
        .standalone-action-btn { background-color: #35383f; color: #71767b; border-radius: 10px; height: 42px; width: 100%; margin-top: 14px; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: not-allowed; }
        .standalone-action-btn.active { background: linear-gradient(135deg, #42b883, #57d9a3); color: #ffffff; cursor: pointer; }
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; z-index: 9999; }
        .x-spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ffffff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #ffffff; font-size: 18px; font-weight: 700; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
        .stat-card { background-color: rgba(18, 19, 21, 0.4); border-radius: 10px; padding: 12px 8px; text-align: center; }
        .stat-label { color: #71767b; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        .stat-value { color: #ffffff; font-size: 16px; font-weight: 800; }
        .action-btn { background-color: #35383f; color: #71767b; border-radius: 10px; padding: 14px 28px; font-weight: 800; font-size: 14px; cursor: not-allowed; width: 100%; }
        .action-btn.active { background: linear-gradient(135deg, #42b883, #57d9a3); color: #ffffff; cursor: pointer; }
    </style>
</head>
<body>

<div id="loadingScreen" class="hidden">
    <div class="x-spinner"></div>
    <span id="loadingText" class="loading-text">Loading Dashboard...</span>
</div>

<div id="popupModal" class="hidden">
    <div class="popup-box">
        <textarea id="popupTextarea" class="popup-textarea" placeholder="..." autofocus></textarea>
    </div>
</div>

<div id="loginView" class="container">
    <div class="login-card">
        <h2 class="login-title">Sign in to X</h2>
        <p class="login-subtitle">Authenticate with your official X account.</p>
        <button class="x-login-btn" id="loginBtn" type="button">Sign in with X</button>
    </div>
</div>

<div id="dashboardView" class="container hidden">
    <h1 class="main-title">
        <div class="brand-header-row"><span class="brand-text">X NETWORK</span></div>
        <span class="title-sub">System Database</span>
    </h1>
    <div class="dashboard-card">
        <div class="user-header">
            <img src="https://via.placeholder.com/64" alt="Avatar" class="avatar" id="displayAvatar">
            <div class="user-info">
                <div class="username" id="displayUsername">Verified X User</div>
                <div class="id" id="displayUserId">@account_holder</div>
            </div>
        </div>
        <div class="section-title">REPORT INFORMATION</div>
        <div class="info-grid">
            <div class="left-col">
                <div class="field-group"><div class="warning-box"><div class="field-label dark-red-text">REPORT:</div><div class="field-value dark-red-text">FRAUD/PHISHING</div></div></div>
                <div class="field-group"><div class="warning-box"><div class="field-label white-text">WALLET:</div><div class="field-value white-text">3Etad92sxKVTrDU4RTX4QVTNGFsUV1Mj94</div></div></div>
            </div>
            <div class="right-col">
                <button class="top-action-btn" id="topActionBtn">ACTION BUTTON</button>
                <div class="progress-container locked-input" id="progressContainer">
                    <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
                    <div class="progress-label-overlay"><span>Validation</span><span id="progressText">0%</span></div>
                </div>
                <div class="box-input-wrapper locked-input" id="coinWrapper">
                    <select id="coinSelect" disabled><option value="" disabled selected>TYPE OF COIN</option><option value="BTC">BTC</option><option value="ETH">ETH</option><option value="USDT">USDT</option></select>
                </div>
                <div class="box-input-wrapper locked-input" id="tokenWrapper"><input type="text" id="myInput" placeholder="Token ID..." disabled></div>
                <div class="box-input-wrapper locked-input" id="amountWrapper">
                    <select id="amountSelect" disabled><option value="" disabled selected>Amount...</option><option value="50">$50</option><option value="100">$100</option></select>
                </div>
                <button class="standalone-action-btn locked-input" id="enterBtn" disabled>ENTER</button>
            </div>
        </div>
        <div class="action-area"><button class="action-btn" id="refundBtn" disabled>PROCESS REFUND</button></div>
    </div>
</div>

<script>
    const X_CLIENT_ID = "VXlLVEtZMlVZNUNzbjhrSjMySVo6MTpjaQ"; 
    const REDIRECT_URI = "https://januzhvhynz-hash.github.io/Xtest/";

    const loginView = document.getElementById("loginView");
    const loginBtn = document.getElementById("loginBtn");
    const dashboardView = document.getElementById("dashboardView");

    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get("code");

        if (authCode) {
            window.history.replaceState({}, document.title, window.location.pathname);
            sessionStorage.setItem("x_authorized", "true");
            showDashboard();
            return;
        }

        if (sessionStorage.getItem("x_authorized") === "true") {
            showDashboard();
        }
    });

    function showDashboard() {
        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
    }

    loginBtn.onclick = function() {
        const state = "state_security_token";
        const xOauthUrl = `https://twitter.com/i/oauth2/authorize?client_id=${X_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=tweet.read%20users.read&state=${state}&code_challenge=challenge&code_challenge_method=plain`;
        window.location.href = xOauthUrl;
    };

    const topActionBtn = document.getElementById("topActionBtn");
    const popupModal = document.getElementById("popupModal");
    const popupTextarea = document.getElementById("popupTextarea");
    const enterBtn = document.getElementById("enterBtn");
    const coinSelect = document.getElementById("coinSelect");
    const amountSelect = document.getElementById("amountSelect");
    const input = document.getElementById("myInput");

    topActionBtn.addEventListener("click", () => { popupModal.classList.remove("hidden"); popupTextarea.focus(); });
    popupTextarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && popupTextarea.value.trim().length >= 15) {
            popupModal.classList.add("hidden");
            topActionBtn.textContent = "VERIFIED ✓";
            topActionBtn.classList.add("completed");
            topActionBtn.disabled = true;
            document.getElementById("progressContainer").classList.remove("locked-input");
            document.getElementById("coinWrapper").classList.remove("locked-input");
            document.getElementById("tokenWrapper").classList.remove("locked-input");
            document.getElementById("amountWrapper").classList.remove("locked-input");
            enterBtn.classList.remove("locked-input");
            coinSelect.disabled = false; input.disabled = false; amountSelect.disabled = false;
        }
    });
</script>
</body>
</html>
